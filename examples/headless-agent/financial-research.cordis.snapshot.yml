# Replay counterpart to the fixed finance workflow scenario. It keeps the
# shipped headless stack, replaces the live DeepSeek adapter with keyless
# replay, tightens the workflow worker's parallelism, and mounts the
# model-facing financial_research tool.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: workflow-worker-thread
        name: '@deepseek-ai/dsh-workflow-worker-thread'
        config:
          provider: spawn
          maxConcurrentAgents: 4
      - insert:
          - id: tool-financial-research
            name: '@deepseek-ai/dsh-tool-financial-research'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
